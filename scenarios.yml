scenarios:
  - id: scenario-1
    name: "Streaming First"
    description: >
      Architecture A: Streaming pipeline with Delta Lake on S3.
      Kafka → Spark Structured Streaming → Delta Lake Silver → batch to Gold.
      No Airflow — the simplest stack.
    profiles: [streaming-first]
    compose_files: [docker-compose.yml]
    env_file: .env.scenario-1
    services_expected:
      - kafdrop
      - zookeeper
      - kafka
      - spark-master
      - spark-worker
      - streaming-job
      - producer
      - localstack
      - postgres

  - id: scenario-2
    name: "Airflow Orchestrated"
    description: >
      Architecture B: Airflow supervises the streaming pipeline and orchestrates batch.
      Same Delta Lake pipeline as Streaming First, now with production-grade orchestration.
    profiles: [airflow-orchestrated]
    compose_files: [docker-compose.yml]
    env_file: .env.scenario-1
    services_expected:
      - kafdrop
      - zookeeper
      - kafka
      - spark-master
      - spark-worker
      - streaming-job
      - producer
      - localstack
      - postgres
      - airflow

  - id: scenario-3
    name: "Trino SQL Engine"
    description: >
      Adds Trino SQL engine and Spark Thrift Server for querying Delta tables.
      dbt deferred to Phase 2 (custom Airflow image required).
      Architecture A + SQL query layer.
    profiles: [streaming-first, trino]
    compose_files:
      - docker-compose.yml
      - compose/scenario-2.yml
    env_file: .env.scenario-2
    services_expected:
      - kafdrop
      - zookeeper
      - kafka
      - spark-master
      - spark-worker
      - streaming-job
      - producer
      - localstack
      - postgres
      - trino
      - spark-thrift

  - id: scenario-4
    name: "Hudi Comparison"
    description: >
      Lakehouse format comparison. Streaming writes Apache Hudi tables
      instead of Delta Lake. Architecture A.
    profiles: [streaming-first]
    compose_files:
      - docker-compose.yml
      - compose/scenario-3.yml
    env_file: .env.scenario-3
    services_expected:
      - kafdrop
      - zookeeper
      - kafka
      - spark-master
      - spark-worker
      - streaming-job
      - producer
      - localstack
      - postgres
